  <PropertyGroup>
    <Name>ResumeBuilder</Name>
    <Solutions>
      <Solution Include="src\Api\Api.csproj" />
      <Solution Include="src\Application\Application.csproj" />
      <Solution Include="src\Domain\Domain.csproj" />
      <Solution Include="src\Infrastructure\Infrastructure.csproj" />
    </Solutions>
  </PropertyGroup>
</Project>

